<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="40%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="flowGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".1"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".1"/></linearGradient><linearGradient id="flowGrad2" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f97316" stop-opacity=".1"/><stop offset="50%" stop-color="#fb923c" stop-opacity=".9"/><stop offset="100%" stop-color="#f43f5e" stop-opacity=".1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".4" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity=".3"/></pattern><style>@keyframes ripple{0%{r:4px;opacity:.9;stroke-width:2px}}@keyframes pulse{0%{opacity:.35;transform:scale(.98)}}.pulse-slow{animation:pulse 6s ease-in-out infinite alternate}.dash-flow1{stroke-dasharray:12,16;animation:flowDash 25s linear infinite}.dash-flow2{stroke-dasharray:8,14;animation:flowDashRev 20s linear infinite}.dash-flow3{stroke-dasharray:15,20;animation:flowDash 30s linear infinite}.beacon-ring,.beacon-ring-delayed{animation:ripple 3s cubic-bezier(0,.2,.8,1) infinite;transform-origin:center}.beacon-ring-delayed{animation:ripple 3s cubic-bezier(0,.2,.8,1) infinite 1.5s}.subtitle-text,.title-text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.subtitle-text{font-weight:400;letter-spacing:2px}.badge-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px;font-weight:600}</style></defs><rect width="1200" height="360" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><g class="pulse-slow" style="transform-origin:center"><circle cx="200" cy="180" r="140" fill="#0284c7" filter="url(#glow)" opacity=".15"/><circle cx="1000" cy="180" r="160" fill="#ea580c" filter="url(#glow)" opacity=".12"/><circle cx="600" cy="100" r="120" fill="#6366f1" filter="url(#glow)" opacity=".1"/></g><g fill="none" stroke="#334155" stroke-opacity=".35"><ellipse cx="980" cy="180" rx="170" ry="170"/><ellipse cx="980" cy="180" rx="170" ry="60"/><ellipse cx="980" cy="180" rx="170" ry="115"/><ellipse cx="980" cy="180" rx="70" ry="170"/><line x1="810" x2="1150" y1="180" y2="180" stroke-dasharray="4 4"/></g><path id="path1" fill="none" stroke="url(#flowGrad1)" stroke-width="2.5" d="M 80 280 C 320 280, 480 80, 780 120 C 890 135, 960 170, 1020 180" class="dash-flow1" filter="url(#glow)"/><path id="path2" fill="none" stroke="url(#flowGrad2)" stroke-width="2" d="M 120 310 C 400 320, 520 220, 750 200 C 880 190, 950 160, 1060 210" class="dash-flow2" filter="url(#glow)"/><path id="path3" fill="none" stroke="#38bdf8" stroke-opacity=".3" stroke-width="1.5" d="M 50 160 C 250 80, 420 240, 680 170 C 850 120, 950 140, 1140 160" class="dash-flow3"/><g transform="translate(240, 245)"><circle cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" class="beacon-ring"/><circle cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" class="beacon-ring-delayed"/><circle cx="0" cy="0" r="4.5" fill="#38bdf8"/></g><g transform="translate(680, 170)"><circle cx="0" cy="0" r="6" fill="none" stroke="#fb923c" class="beacon-ring"/><circle cx="0" cy="0" r="6" fill="none" stroke="#fb923c" class="beacon-ring-delayed"/><circle cx="0" cy="0" r="5" fill="#fb923c"/></g><g transform="translate(980, 180)"><circle cx="0" cy="0" r="8" fill="none" stroke="#a855f7" class="beacon-ring"/><circle cx="0" cy="0" r="8" fill="none" stroke="#a855f7" class="beacon-ring-delayed"/><circle cx="0" cy="0" r="6" fill="#c084fc" filter="url(#glow)"/></g><g><g transform="translate(80, 95) translate(0, 0)"><rect width="250" height="28" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="14"/><circle cx="16" cy="14" r="4" fill="#38bdf8"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.3;1;0.3"/></circle><text x="28" y="18" fill="#93c5fd" class="badge-text">GLOBAL LABOR DEMOGRAPHICS</text></g><text x="0" y="75" fill="#f8fafc" class="title-text" font-size="38" transform="translate(80, 95)">International Migrant Workers</text><text x="0" y="112" fill="#94a3b8" class="subtitle-text" font-size="13" transform="translate(80, 95)">HISTORICAL RETROSPECTIVE &amp; LONG-TERM PROJECTIONS (2013–2050)</text><g><g transform="translate(80, 95) translate(0, 140) translate(0, 0)"><rect width="130" height="48" fill="#1e293b" fill-opacity=".6" stroke="#334155" stroke-width="1" rx="8"/><text x="12" y="22" fill="#64748b" class="badge-text">2013 BASELINE</text><text x="12" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">150.4M</text></g><g transform="translate(80, 95) translate(0, 140) translate(145, 0)"><rect width="130" height="48" fill="#1e293b" fill-opacity=".6" stroke="#334155" stroke-width="1" rx="8"/><text x="12" y="22" fill="#64748b" class="badge-text">2026 CURRENT</text><text x="12" y="40" fill="#fb923c" font-family="system-ui, sans-serif" font-size="16" font-weight="700">~171.5M</text></g><g transform="translate(80, 95) translate(0, 140) translate(290, 0)"><rect width="130" height="48" fill="#1e293b" fill-opacity=".6" stroke="#334155" stroke-width="1" rx="8"/><text x="12" y="22" fill="#64748b" class="badge-text">2050 HORIZON</text><text x="12" y="40" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="16"