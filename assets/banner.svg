<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="flowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#fb923c" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dot Pattern for Globe / Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <style>
      .pulse-slow {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .dash-flow1 {
        stroke-dasharray: 12, 16;
        animation: flowDash 25s linear infinite;
      }
      .dash-flow2 {
        stroke-dasharray: 8, 14;
        animation: flowDashRev 20s linear infinite;
      }
      .dash-flow3 {
        stroke-dasharray: 15, 20;
        animation: flowDash 30s linear infinite;
      }
      .beacon-ring {
        animation: ripple 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        transform-origin: center;
      }
      .beacon-ring-delayed {
        animation: ripple 3s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.5s;
        transform-origin: center;
      }
      .flight-dot {
        animation: flightPath 10s ease-in-out infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        letter-spacing: 2px;
      }
      .badge-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes flowDashRev {
        to { stroke-dashoffset: 1000; }
      }
      @keyframes ripple {
        0% {
          r: 4px;
          opacity: 0.9;
          stroke-width: 2px;
        }
        100% {
          r: 28px;
          opacity: 0;
          stroke-width: 0.5px;
        }
      }
      @keyframes pulse {
        0% { opacity: 0.35; transform: scale(0.98); }
        100% { opacity: 0.65; transform: scale(1.02); }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Grid overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Spheres -->
  <g class="pulse-slow" style="transform-origin: center;">
    <circle cx="200" cy="180" r="140" fill="#0284c7" opacity="0.15" filter="url(#glow)" />
    <circle cx="1000" cy="180" r="160" fill="#ea580c" opacity="0.12" filter="url(#glow)" />
    <circle cx="600" cy="100" r="120" fill="#6366f1" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Stylized Earth Coordinates / Concentric Rings -->
  <g stroke="#334155" stroke-opacity="0.35" fill="none">
    <ellipse cx="980" cy="180" rx="170" ry="170" />
    <ellipse cx="980" cy="180" rx="170" ry="60" />
    <ellipse cx="980" cy="180" rx="170" ry="115" />
    <ellipse cx="980" cy="180" rx="70" ry="170" />
    <line x1="810" y1="180" x2="1150" y2="180" stroke-dasharray="4,4" />
  </g>

  <!-- Dynamic Migration Waveforms & Flight Paths -->
  <path id="path1" d="M 80 280 C 320 280, 480 80, 780 120 C 890 135, 960 170, 1020 180" 
        fill="none" stroke="url(#flowGrad1)" stroke-width="2.5" class="dash-flow1" filter="url(#glow)" />

  <path id="path2" d="M 120 310 C 400 320, 520 220, 750 200 C 880 190, 950 160, 1060 210" 
        fill="none" stroke="url(#flowGrad2)" stroke-width="2" class="dash-flow2" filter="url(#glow)" />

  <path id="path3" d="M 50 160 C 250 80, 420 240, 680 170 C 850 120, 950 140, 1140 160" 
        fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" class="dash-flow3" />

  <!-- Interactive Nodes / Transit Hubs -->
  <!-- Hub 1: South/SE Asia origin marker -->
  <g transform="translate(240, 245)">
    <circle class="beacon-ring" cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" />
    <circle class="beacon-ring-delayed" cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" />
    <circle cx="0" cy="0" r="4.5" fill="#38bdf8" />
  </g>

  <!-- Hub 2: Middle East transit nexus -->
  <g transform="translate(680, 170)">
    <circle class="beacon-ring" cx="0" cy="0" r="6" fill="none" stroke="#fb923c" />
    <circle class="beacon-ring-delayed" cx="0" cy="0" r="6" fill="none" stroke="#fb923c" />
    <circle cx="0" cy="0" r="5" fill="#fb923c" />
  </g>

  <!-- Hub 3: Destination Node -->
  <g transform="translate(980, 180)">
    <circle class="beacon-ring" cx="0" cy="0" r="8" fill="none" stroke="#a855f7" />
    <circle class="beacon-ring-delayed" cx="0" cy="0" r="8" fill="none" stroke="#a855f7" />
    <circle cx="0" cy="0" r="6" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- Main Banner Header Content -->
  <g transform="translate(80, 95)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="250" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" fill="#93c5fd" class="badge-text">GLOBAL LABOR DEMOGRAPHICS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" fill="#f8fafc" class="title-text" font-size="38">
      International Migrant Workers
    </text>

    <!-- Subtitle / Meta -->
    <text x="0" y="112" fill="#94a3b8" class="subtitle-text" font-size="13">
      HISTORICAL RETROSPECTIVE &amp; LONG-TERM PROJECTIONS (2013–2050)
    </text>

    <!-- Metrics Highlights -->
    <g transform="translate(0, 140)">
      <!-- Metric 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="48" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#64748b" class="badge-text">2013 BASELINE</text>
        <text x="12" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="16">150.4M</text>
      </g>

      <!-- Metric 2 -->
      <g transform="translate(145, 0)">
        <rect width="130" height="48" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#64748b" class="badge-text">2026 CURRENT</text>
        <text x="12" y="40" fill="#fb923c" font-family="system-ui, sans-serif" font-weight="700" font-size="16">~171.5M</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(290, 0)">
        <rect width="130" height="48" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="12" y="22" fill="#64748b" class="badge-text">2050 HORIZON</text>
        <text x="12" y="40" fill="#f43f5e" font-family="system-ui, sans-serif" font-weight="700" font-size="16">~245.0M</text>
      </g>
    </g>
  </g>
</svg>
